<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Task Manager</h1>

<form id="task-form">
    <input type="hidden" id="task-id">
    <input type="text" id="title" placeholder="Заголовок" required>
    <textarea id="description" placeholder="Описание"></textarea>
    <select id="status">
        <option value="NEW">NEW</option>
        <option value="IN_PROGRESS">IN_PROGRESS</option>
        <option value="DONE">DONE</option>
    </select>
    <button type="submit">Сохранить</button>
    <button type="button" id="cancel">Отмена</button>
</form>

<table id="tasks">
    <thead>
    <tr><th>ID</th><th>Title</th><th>Description</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody></tbody>
</table>

<script src="app.js"></script>
</body>
</html>
